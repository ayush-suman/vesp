name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: true 
          python-version: ${{ matrix.python-version }}

      - name: Run tests with pytest
        run: |
          uv run pytest